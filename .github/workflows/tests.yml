name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CPU, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the cpu backend compiles its C++ kernels on first use with g++ and OpenMP, both on the runner image
      - run: g++ --version
      - run: uv python install ${{ matrix.python }}
      - run: uv tool install nox
      - run: nox -s tests-${{ matrix.python }}

  lowest:
    name: CPU, lowest dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.10
      - run: uv tool install nox
      - run: nox -s lowest
