[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsar"
dynamic = ["version"]
description = "Synthetic aperture radar image formation on x86 CPUs, Nvidia GPUs and Cloud TPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Paul Singerman"}]
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3", "jax>=0.6.2"]
keywords = ["synthetic aperture radar", "SAR", "backprojection", "image formation", "CPHD", "SICD", "GPU", "TPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/saulpingerman/FastSAR"
Documentation = "https://github.com/saulpingerman/FastSAR/tree/main/docs"
Source = "https://github.com/saulpingerman/FastSAR"
Issues = "https://github.com/saulpingerman/FastSAR/issues"
Changelog = "https://github.com/saulpingerman/FastSAR/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]
io = ["sarpy"]
tpu = ["jax[tpu]"]
geo = ["rasterio"]
test = ["sarpy", "sarkit", "rasterio", "finufft"]

[tool.setuptools]
packages = ["fastsar"]

[tool.setuptools.dynamic]
version = {attr = "fastsar.__version__"}

[tool.setuptools.package-data]
fastsar = ["ffbp_cpu.cpp"]
