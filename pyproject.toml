[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsar"
version = "0.1.0"
description = "Synthetic aperture radar image formation on x86 CPUs, Nvidia GPUs and Cloud TPUs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Paul Singerman"}]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "jax"]
keywords = ["synthetic aperture radar", "SAR", "backprojection", "image formation", "CPHD", "SICD", "GPU", "TPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/saulpingerman/FastSAR"
Documentation = "https://github.com/saulpingerman/FastSAR/tree/main/docs"
Source = "https://github.com/saulpingerman/FastSAR"
Issues = "https://github.com/saulpingerman/FastSAR/issues"
Changelog = "https://github.com/saulpingerman/FastSAR/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]
io = ["sarpy"]
test = ["sarpy", "sarkit", "rasterio", "finufft"]

[tool.setuptools]
packages = ["fastsar"]

[tool.setuptools.package-data]
fastsar = ["ffbp_cpu.cpp"]
