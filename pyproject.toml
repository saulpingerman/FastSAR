[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsar"
dynamic = ["version"]
description = "Synthetic aperture radar image formation on x86 and ARM CPUs, Nvidia GPUs and Cloud TPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Paul Singerman"}]
requires-python = ">=3.10"
# CuPy with the CUDA runtime libraries is installed wherever its wheels run an Nvidia GPU out of the box (as the
# deep-learning frameworks do)
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3", "jax>=0.6.2",
                "cupy-cuda12x[ctk]>=14; sys_platform == 'linux' and platform_machine == 'x86_64'"]
keywords = ["synthetic aperture radar", "SAR", "backprojection", "image formation", "CPHD", "SICD", "GPU", "TPU"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/saulpingerman/FastSAR"
Documentation = "https://github.com/saulpingerman/FastSAR/tree/main/docs"
Source = "https://github.com/saulpingerman/FastSAR"
Issues = "https://github.com/saulpingerman/FastSAR/issues"
Changelog = "https://github.com/saulpingerman/FastSAR/blob/main/CHANGELOG.md"

[project.scripts]
fastsar-doctor = "fastsar.doctor:main"
[project.optional-dependencies]
# cuda and io: part of the default installation since 0.2.0 (kept so that earlier install lines still work)
cuda = ["cupy-cuda12x[ctk]>=14"]
io = []
tpu = ["jax[tpu]>=0.6.2"]
geo = ["rasterio>=1.4.4"]
raw = ["h5py>=3.10"]
# the same packages as the test dependency group, for installers without PEP 735 groups
test = ["pytest>=8", "pytest-timeout", "pytest-xdist", "sarpy>=1.3.64", "sarkit; python_version >= '3.11'", "rasterio>=1.4.4", "finufft", "h5py>=3.10"]

[dependency-groups]
test = ["pytest>=8", "pytest-timeout", "pytest-xdist", "sarpy>=1.3.64", "sarkit; python_version >= '3.11'", "rasterio>=1.4.4", "finufft", "h5py>=3.10"]
dev = [{include-group = "test"}, "nox>=2025.2.9"]

[tool.setuptools]
packages = ["fastsar"]

[tool.setuptools.dynamic]
version = {attr = "fastsar.__version__"}

[tool.setuptools.package-data]
fastsar = ["*.cpp", "*.hpp"]

# Platform wheels with prebuilt CPU kernels (setup.py; .github/workflows/wheels.yml runs this). The kernels are
# loaded with ctypes, so one py3-none wheel per platform serves every Python version: one build each.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
archs = ["native"]
build-frontend = "build"
environment = {FASTSAR_PREBUILT = "1"}
# in the build image, which has a compiler: the kernels are then built natively, the prebuilt ones when asked for
test-command = [
    "python {project}/tests/wheel_check.py --expect native",
    "FASTSAR_KERNELS=prebuilt python {project}/tests/wheel_check.py --expect prebuilt",
    "python -m fastsar.doctor --no-probe",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# the test environment needs no GPU packages
test-environment = {JAX_PLATFORMS = "cpu", CUDA_VISIBLE_DEVICES = ""}

[tool.cibuildwheel.macos]
environment = {FASTSAR_PREBUILT = "1", MACOSX_DEPLOYMENT_TARGET = "11.0"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
timeout = 600
markers = [
    "cuda: needs CuPy and an Nvidia GPU (skipped without one; a failure with --require cuda)",
    "tpu: needs a Cloud TPU (skipped without one; a failure with --require tpu)",
    "needs(*modules): needs optional packages of the test group (skipped without them; a failure with --require io)",
]
